<svg xmlns="http://www.w3.org/2000/svg" width="820" height="104" viewBox="0 0 820 104" role="img" aria-label="Object instances, Mate, Ume, Shin, Reproducible tests">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .name { font-size: 15px; font-weight: 600; fill: #7d8590; }
    .note { font-size: 12px; fill: #8b949e; }
  </style>
  <line x1="82" y1="16" x2="738" y2="16" stroke="#8b949e" stroke-opacity="0.45" stroke-width="1.5"/>
  <circle cx="82" cy="16" r="6" fill="#f24379"/>
  <text class="name" x="82" y="50">Object instances</text>
  <text class="note" x="82" y="72">a few examples from</text>
  <text class="note" x="82" y="89">your object model</text>
  <circle cx="246" cy="16" r="6" fill="#f24379"/>
  <text class="name" x="246" y="50">Mate</text>
  <text class="note" x="246" y="72">learns a grammar</text>
  <text class="note" x="246" y="89">of valid inputs</text>
  <circle cx="410" cy="16" r="6" fill="#f24379"/>
  <text class="name" x="410" y="50">Ume</text>
  <text class="note" x="410" y="72">searches for slow</text>
  <text class="note" x="410" y="89">or crashing ones</text>
  <circle cx="574" cy="16" r="6" fill="#f24379"/>
  <text class="name" x="574" y="50">Shin</text>
  <text class="note" x="574" y="72">shrinks each one</text>
  <text class="note" x="574" y="89">to its essentials</text>
  <circle cx="738" cy="16" r="6" fill="#f24379"/>
  <text class="name" x="738" y="50">Reproducible tests</text>
  <text class="note" x="738" y="72">one SUnit test</text>
  <text class="note" x="738" y="89">per finding</text>
</svg>
